name: Deploy API a VPS

# Solo /api, /migrations y este mismo workflow disparan un deploy. /web no
# tiene nada que hacer acá: Cloudflare Pages lo despliega solo al conectar
# el repo en su dashboard, sin YAML de por medio.
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "migrations/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy.yml"

# Si dos pushes llegan cerca uno del otro, que el segundo espere en vez de
# pisarle el deploy al primero a mitad de camino.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN es automático, no hace falta crear ni guardar nada.
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          # Contexto = raíz del repo, no api/: el Dockerfile necesita copiar
          # /migrations, que es hermana de /api (ver comentario en api/Dockerfile).
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/god-edu-api:latest
            ghcr.io/${{ github.repository_owner }}/god-edu-api:${{ github.sha }}
          # Cache de capas de Docker entre runs de Actions: sin esto, cada
          # deploy recompila Go desde cero (varios minutos). Con esto, si
          # go.mod/go.sum no cambiaron, esa capa se reusa.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar y reiniciar el contenedor de la API en el VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/god-edu

            # Trae la imagen recién publicada. Solo la de /api: postgres no
            # se toca en absoluto en un deploy normal.
            docker compose -f docker-compose.prod.yml pull api

            # Recrea únicamente el contenedor de la API (--no-deps: no
            # reinicia postgres). Las migraciones corren solas al arrancar
            # el binario nuevo (ver api/db/migrate.go) — no hace falta
            # ningún paso extra acá para la base de datos.
            docker compose -f docker-compose.prod.yml up -d --no-deps api

            docker image prune -f
