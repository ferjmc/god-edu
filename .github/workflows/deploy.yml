name: Deploy API a VPS

# Solo /api, /migrations y este mismo workflow disparan un deploy. /web no
# tiene nada que hacer acá: Cloudflare Pages lo despliega solo al conectar
# el repo en su dashboard, sin YAML de por medio.
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "migrations/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy.yml"

# Si dos pushes llegan cerca uno del otro, que el segundo espere en vez de
# pisarle el deploy al primero a mitad de camino.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # El driver "docker" por default de Buildx no soporta exportar caché
      # a type=gha (el error "Cache export is not supported for the docker
      # driver" viene de acá). Este paso arma un builder con el driver
      # "docker-container", que sí lo soporta.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN es automático, no hace falta crear ni guardar nada.
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          # Contexto = raíz del repo, no api/: el Dockerfile necesita copiar
          # /migrations, que es hermana de /api (ver comentario en api/Dockerfile).
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/god-edu-api:latest
            ghcr.io/${{ github.repository_owner }}/god-edu-api:${{ github.sha }}
          # Cache de capas de Docker entre runs de Actions: sin esto, cada
          # deploy recompila Go desde cero (varios minutos). Con esto, si
          # go.mod/go.sum no cambiaron, esa capa se reusa.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sin este paso, docker-compose.prod.yml en el VPS queda huérfano del
      # que vive en el repo — cualquier cambio ahí (agregar un servicio,
      # tocar env vars) requeriría copiarlo a mano de nuevo. El repo es la
      # única fuente de verdad; esto lo mantiene sincronizado en cada deploy.
      - name: Sincronizar docker-compose.prod.yml al VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/var/www/god-edu"
          overwrite: true

      - name: Actualizar y reiniciar los contenedores en el VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/god-edu

            # Trae la imagen de la API recién publicada (postgres/cloudflared
            # no cambian de tag, así que su pull es un no-op la mayoría de
            # las veces).
            docker compose -f docker-compose.prod.yml pull

            # "up -d" reconcilia contra el archivo: solo recrea los
            # contenedores cuya config cambió (o los crea si son nuevos, como
            # cloudflared recién). Postgres queda intacto salvo que su propia
            # definición cambie — no hace falta "--no-deps" a mano, Compose
            # ya hace ese diff solo. Las migraciones corren solas al
            # arrancar el binario nuevo (ver api/db/migrate.go).
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            docker image prune -f
