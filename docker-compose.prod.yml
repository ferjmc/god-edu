# Compose de PRODUCCIÓN — vive en el VPS, no se usa en desarrollo local
# (para eso está docker-compose.yml, con Dockerfile.dev). Diferencia clave:
# "api" acá usa la imagen ya construida y publicada en GHCR (ver
# .github/workflows/deploy.yml), nunca "build:" — el VPS no compila nada,
# solo hace pull y reinicia el contenedor.
#
# Setup inicial en el VPS (una sola vez):
#   mkdir -p /var/www/god-edu && cd /var/www/god-edu
#   # copiar este archivo y un .env con todas las variables (ver .env.example,
#   # incluye TUNNEL_TOKEN — se genera en el dashboard de Cloudflare Zero Trust)
#   docker compose -f docker-compose.prod.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/ferjmc/god-edu-api:latest
    restart: unless-stopped
    environment:
      PORT: ${API_PORT}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      APP_BASE_URL: ${APP_BASE_URL}
      API_BASE_URL: ${API_BASE_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      OAUTH_SESSION_SECRET: ${OAUTH_SESSION_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}
    # Sin "ports": nada expone la API directamente al VPS/internet. El único
    # camino de entrada es el túnel (ver servicio "cloudflared" abajo), que
    # la alcanza por la red interna de Docker usando el nombre del servicio
    # ("api"), no localhost. Menos superficie expuesta que con Caddy.
    depends_on:
      postgres:
        condition: service_healthy

  # cloudflared abre una conexión saliente hacia Cloudflare (no escucha
  # ningún puerto entrante) y les hace de túnel a las requests que llegan a
  # api.tudominio.org. El ruteo hostname → servicio interno se configura en
  # el dashboard de Cloudflare Zero Trust (Networks → Tunnels), no acá — el
  # token es lo único que necesita este contenedor para saber a qué túnel
  # conectarse.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - api

volumes:
  postgres_data:
